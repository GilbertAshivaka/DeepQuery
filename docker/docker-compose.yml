version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: deepquery-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:///./deepquery.db
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../backend:/app/backend
      - document_store:/app/document_store
      - sqlite_data:/app/data
    depends_on:
      - redis
      - neo4j
      - chroma
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Celery Worker ────────────────────────────────────────────
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: deepquery-celery-worker
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../backend:/app/backend
      - document_store:/app/document_store
      - sqlite_data:/app/data
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Redis (Celery broker) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deepquery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── ChromaDB ─────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: deepquery-chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Neo4j ────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: deepquery-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/deepquery_dev_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: deepquery-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deepquery-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - deepquery-net

volumes:
  chroma_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  document_store:
  sqlite_data:

networks:
  deepquery-net:
    driver: bridge
