version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: deepquery-backend
    # No host port: nginx reaches it as `backend:8000` over deepquery-net.
    # (To debug from the host, temporarily add `127.0.0.1:8000:8000` — loopback only.)
    env_file:
      - ../.env
    environment:
      # Absolute path (4 slashes) so the SQLite file lives on the sqlite_data
      # volume, not the throwaway container layer — survives rebuild/redeploy.
      - DATABASE_URL=sqlite:////app/data/deepquery.db
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # Durable agent checkpoints — without this it defaults to localhost in the
      # container and resumable agents silently fall back to non-resumable.
      - AGENT_REDIS_URL=redis://redis:6379/0
    volumes:
      - document_store:/app/document_store
      - sqlite_data:/app/data
    depends_on:
      - redis
      - neo4j
      - chroma
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Celery Worker ────────────────────────────────────────────
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: deepquery-celery-worker
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env
    environment:
      # Must match the backend's DATABASE_URL — same file on the shared volume.
      - DATABASE_URL=sqlite:////app/data/deepquery.db
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AGENT_REDIS_URL=redis://redis:6379/0
    volumes:
      - document_store:/app/document_store
      - sqlite_data:/app/data
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Redis (Celery broker + agent run checkpoints/streams) ───
  # Redis 8: bundles RedisJSON + RediSearch (required by langgraph-checkpoint-redis).
  # AOF (appendonly) is MANDATORY — agent checkpoints, pending approvals, and event
  # streams are sources of truth for paused runs (RESUMABLE_AGENT_SPEC_V2 §6);
  # everysec fsync bounds loss to ≤1s on power failure.
  redis:
    image: redis:8-alpine
    container_name: deepquery-redis
    command: redis-server --appendonly yes --appendfsync everysec
    # NEVER publish Redis on a public host — unauthenticated Redis is a top scan
    # target. Internal services reach it as `redis:6379` over deepquery-net.
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── ChromaDB ─────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: deepquery-chroma
    # Internal only — reached as `chroma:8000` over deepquery-net.
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Neo4j ────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: deepquery-neo4j
    # Internal only — backend reaches it as `bolt://neo4j:7687`. To open the Neo4j
    # browser, SSH-tunnel 7474/7687 rather than publishing them publicly.
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    networks:
      - deepquery-net
  environment:
    - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    - NEO4J_PLUGINS=["apoc"]
    - NEO4J_server_memory_heap_initial__size=256m
    - NEO4J_server_memory_heap_max__size=256m
    - NEO4J_server_memory_pagecache_size=128m

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: deepquery-frontend
    # Internal only — nginx reaches it as `frontend:80` over deepquery-net.
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - deepquery-net

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deepquery-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - deepquery-net

volumes:
  chroma_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  document_store:
  sqlite_data:

networks:
  deepquery-net:
    driver: bridge
