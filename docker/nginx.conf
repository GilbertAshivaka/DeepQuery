worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend_api {
        server backend:8000;
    }

    upstream frontend_app {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M;

        # ── API requests → FastAPI backend ──
        location /api/ {
            proxy_pass         http://backend_api/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Auth routes → FastAPI backend ──
        location /auth/ {
            proxy_pass         http://backend_api/auth/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── SSE streaming endpoint (long-lived connections) ──
        location /api/query/chat {
            proxy_pass         http://backend_api/api/query/chat;
            proxy_set_header   Host $host;
            proxy_set_header   Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
        }

        # ── Everything else → React frontend ──
        location / {
            proxy_pass         http://frontend_app/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
